services:
  career-pipeline:
    build: .
    ports:
      - "8765:8765"
    environment:
      HOST: 0.0.0.0
      PORT: 8765
      NEXT_PUBLIC_APP_NAME: "Career Pipeline"
      NEXT_PUBLIC_ENABLE_DEMO_DATA: "false"
      NEXT_PUBLIC_DEFAULT_CURRENCY: "GBP"
      NEXT_PUBLIC_GHOSTING_THRESHOLD_DAYS: "21"
    volumes:
      - career_pipeline_data:/app/app/data

volumes:
  career_pipeline_data:
